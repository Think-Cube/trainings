site_name: Think-Cube Trainings
site_description: Hands-on cloud, Kubernetes and DevOps trainings with open-source labs
site_url: https://think-cube.github.io/trainings/      # change to https://trainings.thinkcube.dev/ with a custom domain
repo_url: https://github.com/Think-Cube/trainings
repo_name: Think-Cube/trainings
edit_uri: ""
copyright: © Think-Cube · <a href="https://thinkcube.dev">thinkcube.dev</a>

theme:
  name: material
  language: en
  icon:
    logo: material/cube-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: material/web
      link: https://thinkcube.dev
      name: thinkcube.dev
    - icon: fontawesome/brands/github
      link: https://github.com/Think-Cube
      name: Think-Cube on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

exclude_docs: |
  _index_head.md
  _index_tail.md

# nav is generated by scripts/sync_labs.py into mkdocs.gen.yml (INHERIT: mkdocs.yml)
